services: 
  icecast:
    image: moul/icecast:latest
    volumes:
    - logs:/var/log/icecast2
    - /etc/localtime:/etc/localtime:ro 
    environment:
      - ICECAST_SOURCE_PASSWORD="source_pass"
      - ICECAST_RELAY_PASSWORD="relay_pass"
      - ICECAST_ADMIN_USER="ice_admin"
      - ICECAST_ADMIN_PASSWORD="super_secure_admin_pass"
      - ICECAST_STREAM_PASSWORD="stream_pass"
    ports:
    - 8000:8000
